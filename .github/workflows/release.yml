name: Build and release station-board

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install Tkinter build dependency
        run: sudo apt-get update && sudo apt-get install --yes python3-tk

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Embed version from tag
        run: echo "__version__ = '${{ github.ref_name }}'" > src/_version.py

      - name: Build application with PyInstaller
        run: pyinstaller --clean --noconfirm --name station-board --onefile --windowed src/main.py

      - name: Package application
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: tar -czf "station-board-${TAG_NAME}-linux-${{ matrix.arch }}.tar.gz" -C dist station-board

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: station-board-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
          path: station-board-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            release-assets/* \
            --title "$TAG_NAME" \
            --generate-notes
